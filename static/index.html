<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>baton</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <h1>baton</h1>
    <p class="sub">Claim the staging server, the test phone or the deploy slot before you use it. Claims expire on their own.</p>
    <div class="me">
      <input id="who" placeholder="Your name" maxlength="40" autocomplete="off">
      <input id="note" placeholder="What for (optional)" maxlength="120" autocomplete="off">
      <select id="mins" aria-label="Duration">
        <option value="15">15 min</option>
        <option value="30" selected>30 min</option>
        <option value="60">1 hour</option>
        <option value="120">2 hours</option>
      </select>
    </div>
    <form class="add" id="add">
      <input id="newname" placeholder="Name, like staging" required maxlength="40" autocomplete="off">
      <button class="primary">Claim</button>
    </form>
    <p id="msg" role="status"></p>
    <ul id="board"></ul>
    <h2>Recent activity</h2>
    <ol id="log"></ol>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
